name: ci
on:
  push:
    branches:
      - 'dev'
    paths-ignore:
      - 'README.md'

  workflow_dispatch:
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: jaudiotagger
          retention-days: 3
          path: |
            ./jaudiotagger/build/libs/jaudiotagger.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jaudiotagger-sources
          retention-days: 3
          path: |
            ./jaudiotagger/build/libs/jaudiotagger-sources.jar

